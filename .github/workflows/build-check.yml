name: Build check

# Manual, release-free build of every supported platform. The Release workflow
# only runs on a tag (it publishes immediately), so this is the safe way to find
# out whether the macOS job still compiles before cutting a version.
#
# Updater artifacts are disabled here: signing them needs
# TAURI_SIGNING_PRIVATE_KEY, which a check build should not require.

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            bundles: nsis
          - label: macOS
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build (unsigned)
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: prismoo-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
