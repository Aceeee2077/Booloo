<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: asset: http://asset.localhost; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost" />
  <title>Prismoo</title>
  <link rel="stylesheet" href="./lite-settings.css" />
</head>
<body>
  <main class="panel">
    <header data-tauri-drag-region>
      <div data-tauri-drag-region><strong>🐾 Prismoo</strong><span data-i18n="lite.settings.subtitle">轻量桌宠</span></div>
      <div class="header-actions">
        <div class="gh">
          <button id="open-github" type="button" data-i18n-label="lite.settings.github" aria-label="打开 GitHub 仓库">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          </button>
          <span class="gh-tip">GitHub</span>
        </div>
        <button id="close" type="button" data-i18n-label="settings.close" aria-label="关闭设置">✕</button>
      </div>
    </header>

    <section>
      <h2 data-i18n="lite.settings.general">界面</h2>
      <label class="setting" for="language">
        <span data-i18n="settings.language">界面语言</span>
        <select id="language">
          <option value="zh" data-i18n="settings.zh">中文</option>
          <option value="en" data-i18n="settings.en">English</option>
        </select>
      </label>
    </section>

    <section>
      <h1 data-i18n="lite.settings.pets">选择桌宠</h1>
      <div id="skins" class="skins">
        <button type="button" data-skin="bulu">🐈<small data-i18n="lite.skin.bulu">布噜</small></button>
        <button type="button" data-skin="custom">🖼️<small data-i18n="lite.skin.custom">我的图片</small></button>
      </div>
      <button id="choose-image" class="primary" type="button" data-i18n="lite.settings.importImage">导入我的图片…</button>
      <p id="image-status" class="status" role="status"></p>
    </section>

    <section id="import-preview" hidden>
      <h2 data-i18n="lite.settings.confirmTitle">确认图片</h2>
      <div class="preview-row">
        <div><canvas id="original-preview" width="180" height="180"></canvas><small data-i18n="lite.settings.original">原图</small></div>
        <div><canvas id="result-preview" width="180" height="180"></canvas><small data-i18n="lite.settings.result">桌宠效果</small></div>
      </div>
      <label class="check"><input id="remove-background" type="checkbox" /><span data-i18n="lite.settings.removeBackground">去掉纯色背景</span></label>
      <p id="preview-note" class="note"></p>
      <div class="actions">
        <button id="refine-image" type="button" data-i18n="lite.settings.refineCutout">手动微调抠图…</button>
        <button id="confirm-image" class="primary" type="button" data-i18n="lite.settings.useImage">使用这张图片</button>
        <button id="cancel-image" type="button" data-i18n="lite.settings.cancel">取消</button>
      </div>
      <p class="note" data-i18n="lite.settings.refineHint"></p>
    </section>

    <section>
      <h2 data-i18n="lite.settings.daily">日常设置</h2>
      <label class="setting" for="pet-size"><span><span data-i18n="lite.settings.petSize">宠物大小</span> <output id="size-value"></output></span><input id="pet-size" type="range" min="0.75" max="1.5" step="0.05" /></label>
      <label class="setting" for="opacity"><span><span data-i18n="lite.settings.opacity">透明度</span> <output id="opacity-value"></output></span><input id="opacity" type="range" min="0.5" max="1" step="0.05" /></label>
      <label class="check"><input id="auto-move" type="checkbox" /><span data-i18n="lite.settings.autoMove">自主走动</span></label>
      <label class="check"><input id="file-drop-reactions" type="checkbox" /><span data-i18n="lite.settings.fileDrop">拖文件给桌宠时显示互动气泡</span></label>
      <label class="check"><input id="hourly-chime" type="checkbox" /><span data-i18n="lite.settings.hourlyChime">整点轻报时</span></label>
      <label class="check"><input id="load-awareness" type="checkbox" /><span data-i18n="lite.settings.loadAwareness">根据电脑状态做反应</span></label>
      <p class="note" data-i18n="lite.settings.loadHint"></p>
      <label class="check"><input id="auto-launch" type="checkbox" /><span data-i18n="lite.settings.autoLaunch">开机启动</span></label>
      <button id="reset-position" type="button" data-i18n="lite.settings.resetPosition">重置桌宠位置</button>
    </section>

    <section id="health">
      <h2 data-i18n="lite.health.title">健康计划</h2>
      <div class="health-row">
        <label class="check"><input id="stand-reminder" type="checkbox" /><span data-i18n="lite.settings.standReminder">站立提醒</span></label>
        <div class="reminder-controls">
          <label for="stand-interval" data-i18n="lite.settings.interval">提醒间隔</label>
          <select id="stand-interval">
            <option value="5" data-i18n="lite.settings.minutes5">5 分钟</option>
            <option value="10" data-i18n="lite.settings.minutes10">10 分钟</option>
            <option value="20" data-i18n="lite.settings.minutes20">20 分钟</option>
            <option value="30" data-i18n="lite.settings.minutes30">30 分钟</option>
            <option value="custom" data-i18n="lite.settings.custom">自定义</option>
          </select>
          <label id="stand-custom-label" for="stand-custom" hidden><span data-i18n="lite.settings.customMinutes">分钟数</span>
            <input id="stand-custom" type="number" min="1" max="240" step="1" value="5" />
          </label>
        </div>
      </div>
      <p id="stand-status" class="note" role="status"></p>
      <div class="health-row">
        <label class="check"><input id="eye-rest" type="checkbox" /><span data-i18n="lite.health.eyeRest">护眼</span></label>
        <div class="reminder-controls">
          <select id="eye-interval" class="health-interval"></select>
          <label id="eye-custom-label" for="eye-custom" hidden><span data-i18n="lite.settings.customMinutes">分钟数</span>
            <input id="eye-custom" type="number" min="1" max="240" step="1" value="20" />
          </label>
        </div>
      </div>
      <div class="health-row">
        <label class="check"><input id="water" type="checkbox" /><span data-i18n="lite.health.water">喝水</span></label>
        <div class="reminder-controls">
          <select id="water-interval" class="health-interval"></select>
          <label id="water-custom-label" for="water-custom" hidden><span data-i18n="lite.settings.customMinutes">分钟数</span>
            <input id="water-custom" type="number" min="1" max="240" step="1" value="45" />
          </label>
        </div>
      </div>
      <p id="health-status" class="note" role="status"></p>
      <p class="note" data-i18n="lite.health.hint"></p>
    </section>

    <section id="heatmap">
      <h2 data-i18n="lite.heatmap.title">点击热力图</h2>
      <div class="heatmap-bar">
        <div class="heatmap-years">
          <button id="heatmap-prev" type="button" data-i18n-label="lite.heatmap.prevYear" aria-label="上一年">‹</button>
          <span id="heatmap-year" class="heatmap-year-number">2026</span>
          <button id="heatmap-next" type="button" data-i18n-label="lite.heatmap.nextYear" aria-label="下一年">›</button>
        </div>
        <span id="heatmap-summary" class="note"></span>
      </div>
      <div class="heatmap-scroll">
        <div id="heatmap-grid" class="heatmap-grid" role="img"></div>
      </div>
      <div class="heatmap-foot">
        <span class="heatmap-legend"><span data-i18n="lite.heatmap.less">少</span>
          <i class="heatmap-cell" data-level="0"></i><i class="heatmap-cell" data-level="1"></i><i class="heatmap-cell" data-level="2"></i><i class="heatmap-cell" data-level="3"></i><i class="heatmap-cell" data-level="4"></i>
          <span data-i18n="lite.heatmap.more">多</span></span>
      </div>
      <p class="note" data-i18n="lite.heatmap.hint"></p>
    </section>

    <section id="reminders">
      <h2 data-i18n="lite.reminders.title">待办提醒</h2>
      <div class="reminder-form">
        <input id="reminder-text" type="text" maxlength="80" data-i18n-placeholder="lite.reminders.placeholder" />
        <input id="reminder-time" type="time" step="60" data-i18n-label="lite.reminders.time" />
        <button id="reminder-add" class="primary" type="button" data-i18n="lite.reminders.add">添加提醒</button>
      </div>
      <div class="reminder-quick">
        <button type="button" data-reminder-quick="10" data-i18n="lite.reminders.quick10">10 分钟后</button>
        <button type="button" data-reminder-quick="30" data-i18n="lite.reminders.quick30">30 分钟后</button>
        <button type="button" data-reminder-quick="60" data-i18n="lite.reminders.quick60">1 小时后</button>
      </div>
      <ul id="reminder-list" class="reminder-list"></ul>
      <p id="reminder-status" class="status" role="status"></p>
      <p class="note" data-i18n="lite.reminders.hint"></p>
    </section>

    <section id="update-panel">
      <h2 data-i18n="settings.updateSection">🔄 更新</h2>
      <div class="update-grid">
        <span data-i18n="settings.updateVersion">当前版本</span><span id="update-version" class="value">—</span>
        <span data-i18n="settings.updateStatus">状态</span><span id="update-status" class="value">—</span>
      </div>
      <div id="update-progress-row" class="update-progress" hidden>
        <div class="progress"><div id="update-progress-bar" class="progress-fill"></div></div>
        <span id="update-progress-text" class="val">0%</span>
      </div>
      <div class="actions">
        <button id="btn-check-update" type="button" data-i18n="settings.checkUpdate">🔍 立即检查更新</button>
        <button id="btn-download-update" type="button" hidden data-i18n="settings.downloadUpdate">⬇️ 下载更新</button>
        <button id="btn-install-update" class="primary" type="button" hidden data-i18n="settings.restartUpdate">🔄 立即重启更新</button>
      </div>
      <label class="check"><input id="update-auto-check" type="checkbox" /><span data-i18n="settings.updateAutoCheck">启动时检查更新</span></label>
      <label class="check"><input id="update-auto-download" type="checkbox" /><span data-i18n="settings.updateAutoDownload">自动下载新版本</span></label>
      <div id="update-notes-box" hidden>
        <h3 data-i18n="settings.updateNotes">更新日志</h3>
        <pre id="update-notes"></pre>
      </div>
      <p id="update-manual" class="note" hidden></p>
    </section>
  </main>
  <script src="./lite-i18n.js"></script>
  <script src="./lite-day.js"></script>
  <script src="./lite-api.js"></script>
  <script src="./lite-image.js"></script>
  <script src="./lite-settings.js"></script>
</body>
</html>
